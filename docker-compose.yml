services:
  recast:
    build: .
    image: recast
    container_name: recast
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    command: ["node", "--no-experimental-webstorage", "--watch-path=server", "server/index.js"]
    environment:
      HOST: 0.0.0.0
      RECAST_ALLOW_UNAUTHENTICATED: 1
      RECAST_AUTH_USER: ${RECAST_AUTH_USER:-}
      RECAST_AUTH_PASSWORD: ${RECAST_AUTH_PASSWORD:-}
      RETENTION_MINUTES: ${RETENTION_MINUTES:-120}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8192}
      JOB_TIMEOUT_MIN: ${JOB_TIMEOUT_MIN:-180}
      YTDLP_AUTO_UPDATE: ${YTDLP_AUTO_UPDATE:-1}
      # Optional: put a cookies.txt exported from your browser in ./cookies
      # if YouTube asks you to sign in.
      YTDLP_COOKIES: /cookies/cookies.txt
    volumes:
      - ./server:/app/server
      - ./public:/app/public
      - ./test:/app/test
      - recast-data:/app/data
      - ./cookies:/cookies:ro
    shm_size: 1gb

volumes:
  recast-data:
