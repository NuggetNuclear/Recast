<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recast — Convierte cualquier archivo</title>
  <meta name="description" content="Convierte imágenes, vídeo, audio, documentos, libros electrónicos, hojas de cálculo, datos, archivos comprimidos, fuentes y subtítulos — con control total de cada ajuste.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231c1917'/%3E%3Cpath d='M10 12.5h11l-3.2-3.2M22 19.5H11l3.2 3.2' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/inter/index.css">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      const l = localStorage.getItem('recast_lang');
      const lang = (l === 'es' || l === 'en') ? l : ((navigator.language && navigator.language.toLowerCase().startsWith('es')) ? 'es' : 'es');
      document.documentElement.lang = lang;
    } catch {}
  </script>
</head>
<body>
  <a href="#view" class="skip-link" id="skipLink">Saltar al contenido principal</a>
  <header class="topbar" role="banner">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/" aria-label="Recast home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M10 12.5h11l-3.2-3.2M22 19.5H11l3.2 3.2" fill="none" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-name">Recast</span>
      </a>
      <nav class="nav" aria-label="Navegación principal" id="mainNav">
        <a href="#/" data-nav="convert" id="navConvert">Convertir</a>
        <a href="#/formats" data-nav="formats" id="navFormats">Formatos</a>
        <button type="button" class="nav-btn" id="enginesBtn">Motores</button>
        <button type="button" class="nav-btn" id="historyBtn">Historial <span class="nav-counter" id="historyBadge" style="display:none">0</span></button>
      </nav>
      <div class="topbar-actions">
        <button type="button" class="lang-btn" id="langBtn" aria-label="Cambiar idioma" title="Idioma: Español">ES</button>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Theme"></button>
      </div>
    </div>
  </header>

  <main id="view" class="wrap" tabindex="-1" role="main"></main>

  <footer class="footer" role="contentinfo">
    <div class="wrap footer-inner">
      <span id="footerText">Recast se ejecuta totalmente en este ordenador. Los archivos se eliminan automáticamente tras <span id="retention">2 horas</span>.</span>
      <span class="footer-dim" id="engineSummary"></span>
    </div>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="a11yStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <input type="file" id="fileInput" multiple hidden aria-label="Seleccionar archivos">

  <script type="module" src="/js/app.js"></script>
</body>
</html>
